# Once a day: comment on issue #1 how many ECMWF runs are saved.
# GitHub emails the comment; unsubscribe from issue #1 to stop the emails.
name: daily-status
on:
  schedule:
    - cron: "0 12 * * *" # yesterday's 4 runs are all saved by then
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yesterday=$(date -u -d yesterday +%Y%m%d)
          body=""
          for dir in data/*/*; do
            [ "${dir#data/polymarket}" != "$dir" ] && continue
            want=4; [ "${dir#data/icon_d2}" != "$dir" ] && want=8  # ICON-D2 runs every 3 h
            got=$(ls $dir | grep -c "run_$yesterday" || true)
            total=$(ls $dir | wc -l)
            days=$(ls $dir | cut -c5-12 | sort -u | wc -l)
            last=$(ls $dir | tail -1)
            if [ "$got" -eq "$want" ]; then icon="✅"; else icon="⚠️"; fi
            body="$body$icon ${dir#data/} yesterday ($yesterday): $got/$want runs, total $total runs over $days days, latest $last
          "
          done
          gh issue comment 1 --body "$body"
