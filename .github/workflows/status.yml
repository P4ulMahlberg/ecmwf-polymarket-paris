# Once a day: comment on issue #1 how many ECMWF runs are saved.
# GitHub emails the comment; unsubscribe from issue #1 to stop the emails.
name: daily-status
on:
  schedule:
    - cron: "0 12 * * *" # yesterday's 4 runs are all saved by then
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yesterday=$(date -u -d yesterday +%Y%m%d)
          body=""
          for city in $(ls data/ecmwf); do
            got=$(ls data/ecmwf/$city | grep -c "run_$yesterday" || true)
            total=$(ls data/ecmwf/$city | wc -l)
            days=$(ls data/ecmwf/$city | cut -c5-12 | sort -u | wc -l)
            last=$(ls data/ecmwf/$city | tail -1)
            if [ "$got" -eq 4 ]; then icon="✅"; else icon="⚠️"; fi
            body="$body$icon $city yesterday ($yesterday): $got/4 runs, total $total runs over $days days, latest $last
          "
          done
          gh issue comment 1 --body "$body"
