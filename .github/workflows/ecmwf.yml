# Saves every ECMWF ensemble run to data/ecmwf/ and commits it.
# Checks every 30 min. GitHub skips many scheduled runs, so frequent checks keep the gaps
# shorter than the ~6 h a run stays on Open-Meteo. The exact online time is logged in
# available_utc. ~1,450 of the 2,000 free minutes per month.
# (minutes 7/37 because GitHub delays jobs scheduled on the full hour)
name: ecmwf-ensemble
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ecmwf_ens.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ecmwf data/aifs
          git diff --cached --quiet || (git commit -m "Save new ensemble runs" && git push)
