# Once a day: comment on issue #1 how many ECMWF runs are saved.
# GitHub emails the comment; unsubscribe from issue #1 to stop the emails.
name: daily-status
on:
  schedule:
    - cron: "0 12 * * *" # yesterday's 4 runs are all saved by then
  workflow_dispatch:

permissions:
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yesterday=$(date -u -d yesterday +%Y%m%d)
          got=$(ls data/ecmwf | grep -c "run_$yesterday" || true)
          total=$(ls data/ecmwf | wc -l)
          days=$(ls data/ecmwf | cut -c5-12 | sort -u | wc -l)
          last=$(ls data/ecmwf | tail -1)
          if [ "$got" -eq 4 ]; then icon="✅"; else icon="⚠️"; fi
          gh issue comment 1 --body "$icon yesterday ($yesterday): $got/4 runs saved
          total: $total runs over $days days, latest: $last"
